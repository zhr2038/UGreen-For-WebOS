name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test

  package-tv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run package:tv
        env:
          ARES_PROFILE: tv
      - run: python tools/check-tv-package.py
      - uses: actions/upload-artifact@v7
        with:
          name: webos-ipk
          path: dist/CloudFrame.ipk

  test-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install synthetic media test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
      - run: npx playwright-cli install-browser chrome
      - run: npm run test:ui
      - run: node test/run-artwork-ui.mjs
      - run: node test/run-player-options-ui.mjs
      - run: node test/run-heif-ui.mjs
      - run: node test/run-photo-music-ui.mjs
      - run: node test/run-photo-music-stream-ui.mjs
      - run: node tools/check-ui.mjs --photos

  build-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t lg-nas-cinema:ci .
      - run: docker run --rm lg-nas-cinema:ci node tools/configure-nas.mjs --help
      - run: docker run --rm -e STATE_DIR=/tmp/state lg-nas-cinema:ci node tools/pair-code.mjs
