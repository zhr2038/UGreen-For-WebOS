services:
  lg-nas-cinema:
    image: lg-nas-cinema:0.2.1
    build: .
    container_name: lg-nas-cinema
    working_dir: /app
    command: ["node", "server.mjs"]
    restart: unless-stopped
    ports:
      - "8780:8780"
    environment:
      STATE_DIR: /state
      HOST: 0.0.0.0
      PORT: 8780
      TZ: Asia/Shanghai
    volumes:
      - ./state:/state
    mem_limit: 512m
    cpus: "1.0"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
